services:
  postgres:
    image: postgres:16-alpine
    container_name: valetax-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-api:
    build:
      context: .
      dockerfile: Users.API/Dockerfile.dev
    container_name: valetax-users-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=users_db;Username=postgres;Password=postgres
      Services__Wallets__BaseUrl: http://wallets-api:8080
      Services__Wallets__TimeoutSeconds: "30"
      Outbox__PollIntervalSeconds: "2"
      Outbox__BatchSize: "20"
      Outbox__MaxAttempts: "10"
      Metrics__LogIntervalSeconds: "30"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
    ports:
      - "5111:8080"
    volumes:
      - ./SharedModels:/src/SharedModels
      - ./Users.API:/src/Users.API
      - ./Users.Application:/src/Users.Application
      - ./Users.Domain:/src/Users.Domain
      - ./Users.Infrastructure:/src/Users.Infrastructure
      - ./Users.Persistence:/src/Users.Persistence
      - /src/Users.API/bin
      - /src/Users.API/obj
      - /src/Users.Application/bin
      - /src/Users.Application/obj
      - /src/Users.Domain/bin
      - /src/Users.Domain/obj
      - /src/Users.Infrastructure/bin
      - /src/Users.Infrastructure/obj
      - /src/Users.Persistence/bin
      - /src/Users.Persistence/obj
      - /src/SharedModels/bin
      - /src/SharedModels/obj
      - users_nuget:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
      wallets-api:
        condition: service_started
    tty: true

  events-api:
    build:
      context: .
      dockerfile: Events.API/Dockerfile.dev
    container_name: valetax-events-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=events_db;Username=postgres;Password=postgres
      Services__Wallets__BaseUrl: http://wallets-api:8080
      Services__Wallets__TimeoutSeconds: "30"
      Outbox__PollIntervalSeconds: "2"
      Outbox__BatchSize: "20"
      Outbox__MaxAttempts: "10"
      Metrics__LogIntervalSeconds: "30"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
    ports:
      - "5164:8080"
    volumes:
      - ./SharedModels:/src/SharedModels
      - ./Events.API:/src/Events.API
      - ./Events.Application:/src/Events.Application
      - ./Events.Domain:/src/Events.Domain
      - ./Events.Infrastructure:/src/Events.Infrastructure
      - ./Events.Persistence:/src/Events.Persistence
      - /src/Events.API/bin
      - /src/Events.API/obj
      - /src/Events.Application/bin
      - /src/Events.Application/obj
      - /src/Events.Domain/bin
      - /src/Events.Domain/obj
      - /src/Events.Infrastructure/bin
      - /src/Events.Infrastructure/obj
      - /src/Events.Persistence/bin
      - /src/Events.Persistence/obj
      - /src/SharedModels/bin
      - /src/SharedModels/obj
      - events_nuget:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
      wallets-api:
        condition: service_started
    tty: true

  wallets-api:
    build:
      context: .
      dockerfile: Wallets.API/Dockerfile.dev
    container_name: valetax-wallets-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=wallets_db;Username=postgres;Password=postgres
      Services__Users__BaseUrl: http://users-api:8080
      Services__Users__TimeoutSeconds: "30"
      Metrics__LogIntervalSeconds: "30"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
    ports:
      - "5174:8080"
    volumes:
      - ./SharedModels:/src/SharedModels
      - ./Wallets.API:/src/Wallets.API
      - ./Wallets.Application:/src/Wallets.Application
      - ./Wallets.Domain:/src/Wallets.Domain
      - ./Wallets.Infrastructure:/src/Wallets.Infrastructure
      - ./Wallets.Persistence:/src/Wallets.Persistence
      - /src/Wallets.API/bin
      - /src/Wallets.API/obj
      - /src/Wallets.Application/bin
      - /src/Wallets.Application/obj
      - /src/Wallets.Domain/bin
      - /src/Wallets.Domain/obj
      - /src/Wallets.Infrastructure/bin
      - /src/Wallets.Infrastructure/obj
      - /src/Wallets.Persistence/bin
      - /src/Wallets.Persistence/obj
      - /src/SharedModels/bin
      - /src/SharedModels/obj
      - wallets_nuget:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
    tty: true

volumes:
  postgres_data_dev:
  users_nuget:
  events_nuget:
  wallets_nuget:
