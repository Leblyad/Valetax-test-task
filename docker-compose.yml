services:
  postgres:
    image: postgres:16-alpine
    container_name: valetax-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-api:
    build:
      context: .
      dockerfile: Users/Users.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=users_db;Username=postgres;Password=postgres
      Services__Wallets__BaseUrl: http://gateway:5174
      Services__Wallets__TimeoutSeconds: "30"
      Outbox__PollIntervalSeconds: "2"
      Outbox__BatchSize: "20"
      Outbox__MaxAttempts: "10"
      Metrics__LogIntervalSeconds: "30"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      wallets-api:
        condition: service_started
    restart: unless-stopped

  events-api:
    build:
      context: .
      dockerfile: Events/Events.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=events_db;Username=postgres;Password=postgres
      Services__Wallets__BaseUrl: http://gateway:5174
      Services__Wallets__TimeoutSeconds: "30"
      Outbox__PollIntervalSeconds: "2"
      Outbox__BatchSize: "20"
      Outbox__MaxAttempts: "10"
      Metrics__LogIntervalSeconds: "30"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      wallets-api:
        condition: service_started
    restart: unless-stopped

  wallets-api:
    build:
      context: .
      dockerfile: Wallets/Wallets.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=wallets_db;Username=postgres;Password=postgres
      Services__Users__BaseUrl: http://gateway:5111
      Services__Users__TimeoutSeconds: "30"
      Metrics__LogIntervalSeconds: "30"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: valetax-gateway
    ports:
      - "5111:5111"
      - "5164:5164"
      - "5174:5174"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - users-api
      - events-api
      - wallets-api
    restart: unless-stopped

volumes:
  postgres_data:
